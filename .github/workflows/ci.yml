name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: lattice_core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lattice_core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test --reporter expanded

  flutter:
    name: lattice_flutter (widgets)
    runs-on: ubuntu-latest
    # Added in the same run as the Flutter adapter; skipped until its
    # pubspec exists so the first PRs are not blocked by a missing package.
    if: ${{ hashFiles('packages/lattice_flutter/pubspec.yaml') != '' }}
    defaults:
      run:
        working-directory: packages/lattice_flutter
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded
