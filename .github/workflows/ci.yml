name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: lattice_core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lattice_core
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # On failure, print the diff the formatter wants: a contributor whose
      # SDK formats differently otherwise has nothing to go on.
      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed . || {
            dart format .
            git --no-pager diff
            exit 1
          }

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test --reporter expanded

      # pub.dev publishes these docs and scores the package on them, so a
      # broken reference in a doc comment is a real defect, not a nit.
      - name: Build API documentation
        run: |
          dart doc --output "$RUNNER_TEMP/api" 2>&1 | tee "$RUNNER_TEMP/doc.log"
          if grep -qiE "^ *(warning|error):" "$RUNNER_TEMP/doc.log"; then
            echo 'dart doc reported problems; see above.'
            exit 1
          fi

      - name: Check the package is publishable
        run: dart pub publish --dry-run

  flutter:
    name: lattice_flutter (widgets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The adapter lands in a later PR. Until its pubspec exists the rest of
      # this job is skipped, so the first PRs are not blocked by a package
      # that is not there yet. hashFiles cannot be used in a job-level `if`,
      # which needs a checked-out workspace, so the check is a step.
      - name: Look for the package
        id: check
        run: |
          if [ -f packages/lattice_flutter/pubspec.yaml ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'packages/lattice_flutter not present yet; skipping.'
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: packages/lattice_flutter
        run: flutter pub get

      - name: Check formatting
        if: steps.check.outputs.exists == 'true'
        working-directory: packages/lattice_flutter
        run: |
          dart format --output=none --set-exit-if-changed . || {
            dart format .
            git --no-pager diff
            exit 1
          }

      - name: Analyze
        if: steps.check.outputs.exists == 'true'
        working-directory: packages/lattice_flutter
        run: flutter analyze

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: packages/lattice_flutter
        run: flutter test --reporter expanded
