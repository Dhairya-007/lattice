name: Publish to pub.dev

# Automated publishing via OIDC: no credentials are stored in this repo.
# Before the first automated run, enable "Automated publishing" on each
# package's pub.dev admin page and point it at this repository with the tag
# pattern below. The very first version of a package has to be published
# manually with `dart pub publish`, which is what claims the name.
#
# A tag is the only thing that can publish. pub.dev's automated publishing is
# configured against the tag pattern, so the OIDC token from any other ref is
# refused with "publishing from github is not enabled" - a workflow_dispatch
# cannot stand in for a tag, however convenient that would be.
#
# The manual trigger is therefore a pre-flight, not a release: it packages the
# package and runs every check `dart pub publish --dry-run` can run, so a
# metadata mistake is found before a tag is pushed. That matters because
# pub.dev enforces some rules only at upload - a screenshot description over
# 200 characters is one - and a tag that is refused cannot be reused without
# rewriting it.
on:
  push:
    tags:
      - 'lattice_core-v[0-9]+.[0-9]+.[0-9]+'
      - 'lattice_flutter-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      package:
        description: Which package to check (dry run only; a tag publishes)
        required: true
        type: choice
        options:
          - lattice_core
          - lattice_flutter

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for pub.dev OIDC
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve which package to publish
        id: package
        env:
          CHOSEN: ${{ inputs.package }}
        run: |
          if [ -n "$CHOSEN" ]; then
            echo "name=$CHOSEN" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Say what is about to be published
        working-directory: packages/${{ steps.package.outputs.name }}
        run: |
          echo "package: ${{ steps.package.outputs.name }}"
          echo "version: $(grep '^version:' pubspec.yaml)"
          echo "ref:     ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          echo "mode:    ${{ github.event_name == 'push' && 'publish' || 'dry run' }}"

      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        if: steps.package.outputs.name == 'lattice_flutter'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: packages/${{ steps.package.outputs.name }}
        run: dart pub get

      - name: Check the package (manual run)
        if: github.event_name == 'workflow_dispatch'
        working-directory: packages/${{ steps.package.outputs.name }}
        run: dart pub publish --dry-run

      - name: Publish (tag only)
        if: github.event_name == 'push'
        working-directory: packages/${{ steps.package.outputs.name }}
        run: dart pub publish --force
