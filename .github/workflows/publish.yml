name: Publish to pub.dev

# Automated publishing via OIDC: no credentials are stored in this repo.
# Before the first automated run, enable "Automated publishing" on each
# package's pub.dev admin page and point it at this repository with the tag
# pattern below. The very first version of a package has to be published
# manually with `dart pub publish`, which is what claims the name.
#
# A tag is the normal trigger. The manual one exists because pub.dev enforces
# some checks only at upload - a screenshot description over 200 characters is
# one, and `dart pub publish --dry-run` does not catch it - so a tag can be
# pushed, authenticate, and still be refused. Fixing the metadata and running
# this by hand publishes the version the tag was for, without rewriting the
# tag.
on:
  push:
    tags:
      - 'lattice_core-v[0-9]+.[0-9]+.[0-9]+'
      - 'lattice_flutter-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        options:
          - lattice_core
          - lattice_flutter

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for pub.dev OIDC
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve which package to publish
        id: package
        env:
          CHOSEN: ${{ inputs.package }}
        run: |
          if [ -n "$CHOSEN" ]; then
            echo "name=$CHOSEN" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Say what is about to be published
        working-directory: packages/${{ steps.package.outputs.name }}
        run: |
          echo "package: ${{ steps.package.outputs.name }}"
          echo "version: $(grep '^version:' pubspec.yaml)"
          echo "ref:     ${GITHUB_SHA}"

      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        if: steps.package.outputs.name == 'lattice_flutter'
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: packages/${{ steps.package.outputs.name }}
        run: dart pub get

      - name: Publish
        working-directory: packages/${{ steps.package.outputs.name }}
        run: dart pub publish --force
