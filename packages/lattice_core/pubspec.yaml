name: lattice_core
# pub.dev scores this: between 60 and 180 characters, because a search result
# only shows the first part of it. 161.
description: >-
  Pure Dart data grid engine: multi-column sorting, filtering, search,
  grouping with aggregates, tree rows, virtualization, selection, cell editing
  and CSV export.
version: 0.4.1
homepage: https://github.com/Dhairya-007/lattice
repository: https://github.com/Dhairya-007/lattice
issue_tracker: https://github.com/Dhairya-007/lattice/issues

# pub.dev allows five. These are the words people search the site with, which
# is the whole of what a topic is for.
topics:
  - datagrid
  - table
  - data-table
  - grid
  - spreadsheet

# Shown in the gallery on the package page. The engine draws nothing itself,
# so these are labelled diagrams of what it drives through an adapter.
#
# Two different limits apply, and neither is checked by
# `dart pub publish --dry-run`: the upload refuses a description over 200
# characters, and the package score wants it under 160. 154.
screenshots:
  - description: >-
      Labelled diagram of the grid: a frozen column, a multi-sort header, a
      filter row, a group header with its subtotal, a selected range and a
      summary footer.
    path: doc/anatomy-light.png
  - description: The same diagram in dark mode.
    path: doc/anatomy-dark.png

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0
