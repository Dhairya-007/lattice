name: lattice_core
description: >-
  Pure Dart data grid and data table engine: multi-column sorting, filtering,
  search, grouping with aggregates, tree rows, virtualization, row and range
  selection, cell editing, CSV export, paging and saved views.
version: 0.4.0
homepage: https://github.com/Dhairya-007/lattice
repository: https://github.com/Dhairya-007/lattice
issue_tracker: https://github.com/Dhairya-007/lattice/issues

# pub.dev allows five. These are the words people search the site with, which
# is the whole of what a topic is for.
topics:
  - datagrid
  - table
  - data-table
  - grid
  - spreadsheet

# Shown in the gallery on the package page. The engine draws nothing itself,
# so these are labelled diagrams of what it drives through an adapter.
#
# pub.dev refuses a description over 200 characters, and refuses it at upload
# rather than in `dart pub publish --dry-run`.
screenshots:
  - description: >-
      Labelled diagram of the grid: a frozen column, a multi-sort header, a
      filter row, a group header with its subtotal, a selected range, a cell
      being edited, and a summary footer.
    path: doc/anatomy-light.png
  - description: The same diagram in dark mode.
    path: doc/anatomy-dark.png

environment:
  sdk: ^3.5.0

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0
