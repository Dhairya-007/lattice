name: lattice_flutter
description: >-
  Open source Flutter data grid and data table: frozen columns, virtualized
  rows, multi-column sorting, filtering, search, grouping with aggregates,
  tree rows, range selection, inline editing, CSV export and paging.
version: 0.1.0
homepage: https://github.com/Dhairya-007/lattice
repository: https://github.com/Dhairya-007/lattice
issue_tracker: https://github.com/Dhairya-007/lattice/issues

# Shown in the gallery on the package page. These are labelled diagrams of
# the grid's parts rather than screenshots of the app, because a recording of
# the example app needs a machine with the Flutter SDK.
#
# pub.dev refuses a description over 200 characters, and refuses it at upload
# rather than in `dart pub publish --dry-run`.
screenshots:
  - description: >-
      Labelled diagram of the grid: a frozen column, a multi-sort header, a
      filter row, a group header with its subtotal, a selected range, a cell
      being edited, and a summary footer.
    path: doc/anatomy-light.png
  - description: The same diagram in dark mode, which the theme follows.
    path: doc/anatomy-dark.png

topics:
  - datagrid
  - table
  - data-table
  - widgets
  - spreadsheet

environment:
  sdk: ^3.8.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Material moved out of the Flutter SDK in 3.47; package:flutter/material.dart
  # is a deprecated shim.
  material_ui: ^1.11.0
  # Switched to a hosted constraint at release time; see RELEASING.md.
  lattice_core:
    path: ../lattice_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
