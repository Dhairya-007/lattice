include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  errors:
    # lattice_flutter depends on the engine by path during development. The
    # release commit swaps it for the hosted constraint - see RELEASING.md.
    invalid_dependency: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - use_super_parameters
